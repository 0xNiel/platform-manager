---
# Deployment for Platform Manager Micro-Frontend (MFE)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-manager-mfe
  namespace: platform-system
  labels:
    app: platform-manager-mfe
    component: mfe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-manager-mfe
  template:
    metadata:
      labels:
        app: platform-manager-mfe
        component: mfe
    spec:
      containers:
      - name: mfe
        image: localhost:5001/platform-manager-mfe:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101  # nginx user
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false  # nginx needs to write to /var/cache/nginx
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

---
# Service for Platform Manager MFE
apiVersion: v1
kind: Service
metadata:
  name: platform-manager-mfe
  namespace: platform-system
  labels:
    app: platform-manager-mfe
    component: mfe
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: platform-manager-mfe

---
# Optional: Ingress for external access (if not behind gateway)
# If your gateway is the only consumer, you may not need this
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-manager-mfe
  namespace: platform-system
  labels:
    app: platform-manager-mfe
  annotations:
    # CORS is already handled by nginx
    nginx.ingress.kubernetes.io/enable-cors: "false"
    # Cache static assets
    nginx.ingress.kubernetes.io/configuration-snippet: |
      location ~* \.(js|css|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }
spec:
  ingressClassName: nginx
  rules:
  - host: platform-mfe.example.com  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: platform-manager-mfe
            port:
              number: 80
  # tls:
  # - hosts:
  #   - platform-mfe.example.com
  #   secretName: platform-mfe-tls
