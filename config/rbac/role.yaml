---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.crossplane.io
  resources:
  - compositeresourcedefinitions
  - compositions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - iam.aws.upbound.io
  resources:
  - groups
  - policies
  - rolepolicyattachments
  - roles
  - users
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pkg.crossplane.io
  resources:
  - providers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.platform.io
  resources:
  - resourcesummaries
  - tenanthealth
  - tenants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.platform.io
  resources:
  - resourcesummaries/status
  - tenanthealth/status
  - tenants/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - platform.platform.io
  resources:
  - tenants/finalizers
  verbs:
  - update
