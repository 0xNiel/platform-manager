# hack/crossplane/provider-aws.yaml
# Crossplane AWS providers for local development against LocalStack.
# IAM backs the drift scanner. S3 and DynamoDB back the sample buckets,
# tables, and the MLPlatform composition.
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-iam
spec:
  # v1.7.0 is compatible with Crossplane 1.20.0
  package: xpkg.upbound.io/upbound/provider-aws-iam:v1.7.0
  runtimeConfigRef:
    name: provider-aws
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-s3
spec:
  package: xpkg.upbound.io/upbound/provider-aws-s3:v1.7.0
  runtimeConfigRef:
    name: provider-aws
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-dynamodb
spec:
  package: xpkg.upbound.io/upbound/provider-aws-dynamodb:v1.7.0
  runtimeConfigRef:
    name: provider-aws
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-aws
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              args:
                - --debug
              env:
                # LocalStack credentials (dummy values)
                - name: AWS_ACCESS_KEY_ID
                  value: "test"
                - name: AWS_SECRET_ACCESS_KEY
                  value: "test"
              # Upjet providers load a large Terraform schema at startup. Tighter
              # limits (256Mi / 200m) left them stuck starting or OOMKilled.
              resources:
                limits:
                  memory: 1Gi
                requests:
                  memory: 256Mi
                  cpu: 100m
