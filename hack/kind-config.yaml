# hack/kind-config.yaml
# Kind cluster configuration for Platform Manager development
# Using single node to reduce resource usage for local dev
#
# No host port mappings: the manager (:9080) and UI dev server (:9082) run on
# the host, and ArgoCD is reached with `make argocd-port-forward`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-manager
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
# Uncomment below to add worker nodes if needed (requires more Docker resources)
